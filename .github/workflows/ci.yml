name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tokens al día con tokens/figma-export.json
        run: npm run tokens:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
